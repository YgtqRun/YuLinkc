[package]
name = "yulink-linux"
version = "1.1.0"
edition = "2021"
description = "Headless Dr.COM campus network client for YuLink on Linux/fnOS"

[dependencies]
anyhow = "1"
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "signal", "time"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
