<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无线校园网认证 - YuLink Mock</title>
<style>
  body{
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    margin: 0; background: #eef2f7;
    display: flex; min-height: 100vh;
    align-items: center; justify-content: center; color: #1f2937;
  }
  .card{
    background: #fff; border-radius: 12px;
    padding: 28px 34px; width: 360px;
    box-shadow: 0 12px 32px rgba(0,0,0,.10);
  }
  h1{ font-size: 18px; margin: 0 0 4px; }
  p.sub{ color: #6b7280; font-size: 12px; margin: 0 0 18px; }
  input, select{
    display: block; box-sizing: border-box; width: 100%;
    margin: 8px 0; padding: 9px 10px;
    border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
  }
  input[type="hidden"]{ display: none !important; }
  #login_btn{
    display: block; text-align: center; background: #1677ff; color: #fff;
    padding: 10px; border-radius: 6px; margin-top: 14px;
    cursor: pointer; font-size: 14px; user-select: none;
  }
  #message{ color: #cf1322; font-size: 13px; min-height: 18px; margin-top: 10px; }
  #result-box{ color: #16a34a; font-size: 14px; font-weight: 600; min-height: 18px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="card">
    <h1>无线校园网认证</h1>
    <p class="sub">mock：按 172.26.255.2 结构复刻</p>
    <div id="f1_div">
      <form id="form1" action="#" method="get">
        <!-- 前两个 input 为隐藏字段，保证第 3/4 个 input 是账号和密码（与注入脚本选择器对应） -->
        <input type="hidden" id="wlan_user_ip" value="10.0.0.5">
        <input type="hidden" id="wlan_user_mac" value="00:11:22:33:44:55">
        <input type="text" id="DDDDD" placeholder="账号" autocomplete="off" spellcheck="false">
        <input type="password" id="upass" placeholder="密码" autocomplete="off">
        <input type="text" id="dynPass" maxlength="6" autocomplete="off" placeholder="动态密码（6 位数字）">
        <select name="ISP_select">
          <option value="0">运营商</option>
          <option value="2" selected>中国电信</option>
          <option value="3">中国移动</option>
        </select>
        <a id="login_btn">登 录</a>
        <div id="message"></div>
        <div id="result-box"></div>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var result = q.get('result') || 'success';
      var badcode = q.get('badcode') === '1';
      document.getElementById('login_btn').addEventListener('click', function () {
        var acc = document.getElementById('DDDDD').value.trim();
        var pwd = document.getElementById('upass').value;
        var code = document.getElementById('dynPass').value.trim();
        var msg = document.getElementById('message');
        var box = document.getElementById('result-box');
        msg.textContent = '';
        box.textContent = '';
        if (!acc || !pwd) { msg.textContent = '请输入账号和密码'; return; }
        if (badcode && code !== '123456') { msg.textContent = '动态密码错误，请重新获取'; return; }
        if (result === 'fail') { msg.textContent = '认证失败：用户名或密码错误'; return; }
        setTimeout(function () { box.textContent = '已连接（mock 成功）'; }, 300);
      });
    })();
  </script>
</body>
</html>
